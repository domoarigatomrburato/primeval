name: Pages

# Builds the demo (demo/, assembled by scripts/demo.mjs) and deploys it to
# GitHub Pages. Pages cannot send the COOP/COEP headers threads need; the
# demo's own service worker (demo/coi-sw.js) adds them.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No caches, as in the release workflow: they could be poisoned
          # (zizmor cache-poisoning), and this job publishes.
          package-manager-cache: false

      - run: npm ci

      # The pinned stable, with the wasm target from rust-toolchain.toml.
      - run: rustup toolchain install

      # The dated nightly for the threaded build, pinned in the script.
      - run: node scripts/build-wasm.mjs install-nightly

      # The CLI must match the wasm-bindgen crate in Cargo.lock. Built from
      # source with its lockfile, without a cache (see above).
      - run: cargo install wasm-bindgen-cli --locked --version "$(node scripts/build-wasm.mjs wasm-bindgen-version)"

      - run: npm run build

      - run: npm run build:wasm

      - run: npm run demo:build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
