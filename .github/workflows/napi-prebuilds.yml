name: NAPI Prebuilds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  target-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - id: targets
        run: echo "matrix=$(node scripts/napi-targets.mjs release-matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: [quality, target-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.target-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        # The env-var references below must expand the same way on Windows.
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: rustup toolchain install

      - run: rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build native addon
        run: npx napi build -p primeval-node --release --target "$TARGET" --platform --no-js --output-dir .
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: primeval-node.*.node
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Create platform package dirs
        run: npx napi create-npm-dirs --npm-dir npm

      - name: Copy native artifacts into platform packages
        run: npx napi artifacts --output-dir artifacts --npm-dir npm

      - name: Verify native package completeness
        run: node scripts/napi-targets.mjs verify-artifacts npm

      - name: Publish platform packages
        run: npx napi pre-publish -t npm --npm-dir npm

      - name: Publish npm package
        run: npm publish --access public
