[package]
name = "primeval-wasm"
version.workspace = true
edition = "2024"
homepage.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
# The rayon pool on Web Workers. Only the threaded build enables it; it needs
# the nightly toolchain and flags in scripts/build-wasm.mjs.
threads = ["dep:wasm-bindgen-rayon"]

[dependencies]
js-sys = "0.3.106"
primeval-js = { path = "../crates/primeval-js" }
primeval-render = { path = "../crates/primeval-render" }
wasm-bindgen = "0.2.129"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "1.3.0", optional = true, features = ["no-bundler"] }
