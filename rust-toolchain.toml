[toolchain]
channel = "1.99.0"
# rust-analyzer serves the editor and Claude Code's LSP tool; a pin bump installs it with the rest.
components = ["rustfmt", "clippy", "rust-analyzer"]
# The single-threaded wasm build (scripts/build-wasm.mjs) uses this toolchain.
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
